<div class="netflix-container">
  <nav class="navbar">
    <img src="https://wikimedia.org" class="logo">
  </nav>

  <header class="banner">
    <div class="banner-content">
      <h1>Featured Title</h1>
      <div class="banner-buttons">
        <button class="btn play">Play</button>
        <button class="btn list">My List</button>
      </div>
      <p class="description">Watch the latest trending movies and TV shows now.</p>
    </div>
  </header>

  <div class="row">
    <h2>Trending Now</h2>
    <div class="posters-container">
      <img *ngFor="let movie of movies" 
           [src]="movie.posterPath" 
           class="poster" 
           [alt]="movie.title">
    </div>
  </div>
</div>
