<div class="netflix-container">
  <!-- Navbar -->
  <nav class="navbar">
    <img src="https://wikimedia.org" class="logo">
  </nav>

  <!-- Hero Banner -->
  <header class="banner">
    <div class="banner-content">
      <h1>Stranger Things</h1>
      <button class="btn">Play</button>
      <button class="btn gray">My List</button>
      <p class="description">When a young boy vanishes, a small town uncovers a mystery involving secret experiments...</p>
    </div>
  </header>

  <!-- Movie Rows -->
  <div class="row" *ngFor="let category of ['Trending', 'Action', 'Originals']">
    <h2>{{category}}</h2>
    <div class="posters">
      <img *ngFor="let movie of movies" 
           [src]="movie.posterPath" 
           class="poster" 
           [alt]="movie.title">
    </div>
  </div>
</div>
